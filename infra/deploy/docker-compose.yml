name: gameforge

# All values come from infra/deploy/.env (copy .env.example first).
# This file is infrastructure: putting containers on one network is NOT the
# security boundary — the boundary is the runner's spawn gate (see
# apps/runner/src/runner.ts) plus the explicit isolation flags below.

services:
  reverse-proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.api
    env_file:
      - .env
    environment:
      PORT: "8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Project git repos, blobs, artifacts. 0700 on the host (see scripts/init.sh).
      - ${STORAGE_ROOT:-/var/lib/gameforge}:/var/lib/gameforge
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    healthcheck:
      # BROWSER/CRAWLER SAFETY: 127.0.0.1 only — the proxy is the public face.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8090/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${STORAGE_ROOT:-/var/lib/gameforge}:/var/lib/gameforge
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    # HONEST: no HTTP server here, so no HTTP healthcheck. Worker health is the
    # BullMQ queue heartbeat, surfaced at GET /api/v1/system/metrics. A fake
    # `node -e "process.exit(0)"` healthcheck would be theater; we omit it.

  runner:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.runner
    env_file:
      - .env
    volumes:
      # !!!! THE SINGLE PRIVILEGED SPAWN GATE !!!!
      # This is the ONLY service with the Docker socket. api and worker MUST
      # NEVER get it. The runner service itself runs as root (documented in
      # Dockerfile.runner); every workload container it spawns runs as
      # 65532:65532 with --cap-drop=ALL, --read-only, --network none and
      # strict CPU/RAM/pid quotas. See apps/runner/src/runner.ts.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STORAGE_ROOT:-/var/lib/gameforge}:/var/lib/gameforge
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 4G }
    # The runner HTTP binding lands in Phase 3. Until then service.js idles;
    # validate the gate with:
    #   docker compose exec runner node apps/runner/dist/service.js --check

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gameforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gameforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gameforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # reverse-proxy's public face. No other service joins.
  frontend:
  # Internal only. No published ports; the proxy is the single entry point.
  backend:
    internal: true

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
